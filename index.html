<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2b24;--mu:#5d6b63;--ac:#1f7a4d;--bd:#d6ddd8;--ok:#1f7a4d;--no:#c23a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a16;--card:#1b2620;--tx:#e6eee9;--mu:#9baba2;--ac:#4cc58a;--bd:#32433a;--ok:#4cc58a;--no:#ef7a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--bd)}h1{margin:0;font-size:20px}header small{color:var(--mu)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1000px;margin:auto;padding:12px;display:grid;grid-template-columns:1fr 250px;gap:14px}@media(max-width:800px){main{grid-template-columns:1fr}}
.omr{position:sticky;top:8px;align-self:start;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}@media(max-width:800px){.omr{position:static;order:-1}}
.omr h3{margin:0 0 6px;font-size:14px}.g{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}.r{display:flex;align-items:center;gap:3px;font-size:11px}.r b{width:20px;text-align:right;cursor:pointer}
.bb{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--mu);font-size:9px;display:grid;place-items:center;cursor:pointer;color:var(--mu)}.bb.s{background:var(--tx);color:var(--bg);border-color:var(--tx)}.bb.ok{background:var(--ok);border-color:var(--ok);color:#fff}.bb.no{background:var(--no);border-color:var(--no);color:#fff}.bb.key{outline:2px solid var(--ok)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}.q h4{margin:0 0 6px}.en{color:var(--mu);font-style:italic}
.q img{max-width:100%;display:block;margin:8px auto;border:1px solid var(--bd);border-radius:6px;background:#fff}.il{text-align:center;border:1px dashed var(--bd);border-radius:8px;padding:8px;margin:8px 0;font-size:34px}.il small{display:block;font-size:12px;color:var(--mu)}
.o{display:flex;gap:8px;width:100%;text-align:left;margin-top:6px}.o i{font-style:normal;font-weight:700;min-width:18px}.o.s{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}.o.ok{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok)}.o.no{background:color-mix(in srgb,var(--no) 20%,var(--card));border-color:var(--no)}
.sc{font-size:30px;font-weight:700;color:var(--ac)}#nm{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%;max-width:320px;margin-top:8px}.hide-bm .bm,.hide-en .en{display:none}.rv{border-left:4px solid var(--no);padding:6px 10px;margin:6px 0;background:var(--card);border-radius:6px}
